[workspace]
members = [".", "ingest"]
default-members = [".", "ingest"]

[package]
name = "ninja-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight per-service CPU, memory and disk monitor for a single Linux VPS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NinjaGoldfinch/ninja-monitor"
readme = "README.md"
keywords = ["monitoring", "systemd", "cgroup", "discord", "vps"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "time", "sync", "signal", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"   # measured smaller binary and lower RSS than 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
