[package]
name = "ninja-ingest"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Central ingestion server for ninja-monitor agents: stores pushed samples in SQLite and serves them"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NinjaGoldfinch/ninja-monitor"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
ninja-monitor = { path = ".." }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "time", "sync", "signal", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
