# cargo-nextest. CI runs `--profile ci` (through cargo llvm-cov) and copies
# the JUnit file to reports/junit.xml; `cargo test` still works locally.

[profile.ci]
# Report every failing test, not only the first binary's.
fail-fast = false
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml under the workspace root.
path = "junit.xml"
