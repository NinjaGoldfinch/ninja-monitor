# Local development config. Reads the live copy of the fixture trees that
# dev/simulate.sh keeps up to date. Run from the repository root:
#
#   dev/simulate.sh                              # terminal 1
#   cargo run -- --config dev/config.toml        # terminal 2
#   curl -s localhost:9090/stats                 # terminal 3
#   curl -s "localhost:9090/history?scope=service:riot-proxy&minutes=5"

[server]
bind = "127.0.0.1:9090"

[sampling]
interval = "5s"
disk_interval = "1m"
history = "1h"

[paths]
cgroup_root = "dev/live/cgroup"
proc_root = "dev/live/proc"

[host]
name = "dev"
mounts = ["/"]

[[service]]
name = "riot-proxy"
unit = "riot-proxy.service"
paths = ["tests/fixtures"]   # any local directory, just to show disk_bytes

[[service]]
name = "cloudflared"
unit = "cloudflared.service"

[[service]]
name = "site"
unit = "site.service"     # no fixture directory, so this one shows as down

[discord]
enabled = false

# Notifications only go out if NINJA_MONITOR_DISCORD_WEBHOOK is set.

# The simulator moves riot-proxy's anon memory between about 199 and 249 MiB,
# so this rule goes pending, fires and resolves now and then.
[[alert]]
name = "riot-proxy memory high"
scope = "service:riot-proxy"
metric = "mem_anon_bytes"
op = ">"
threshold = 235000000
for = "10s"

[[alert]]
name = "host memory low"
scope = "host"
metric = "mem_available_percent"
op = "<"
threshold = 10
for = "5m"

[[alert]]
name = "site down"
scope = "service:site"
metric = "down"
for = "15s"

[[alert]]
name = "riot-proxy OOM kill"
scope = "service:riot-proxy"
metric = "oom_kill"
